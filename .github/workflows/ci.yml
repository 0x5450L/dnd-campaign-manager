name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://dnd_user:dnd_secret@localhost:5432/dnd_test
      JWT_SECRET: integration-tests-only

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dnd_user
          POSTGRES_PASSWORD: dnd_secret
          POSTGRES_DB: dnd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_user -d dnd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w server

      - name: Build shared
        run: npm run build -w shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration -w server

      - name: Production build
        run: npm run build

  deploy:
    name: Build image and deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY: dnd-campaign-manager
      ECS_SERVICE: dnd-campaign-manager
      ECS_CLUSTER: default

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecs-role
          role-session-name: github-actions-dnd-deploy

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          uri="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          docker build --platform linux/amd64 -t "$uri" .
          docker push "$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.image.outputs.uri }}
          execution-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          container-port: 3001
          health-check-path: /api/health
          cpu: '256'
          memory: '1024'
          min-task-count: 1
          max-task-count: 1
          environment-variables: |
            [
              {"name": "DATABASE_URL", "value": "${{ secrets.DATABASE_URL }}"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET }}"},
              {"name": "DEMO_RESEED_HOURS", "value": "6"}
            ]

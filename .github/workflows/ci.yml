name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://dnd_user:dnd_secret@localhost:5432/dnd_test
      JWT_SECRET: integration-tests-only

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dnd_user
          POSTGRES_PASSWORD: dnd_secret
          POSTGRES_DB: dnd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_user -d dnd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w server

      - name: Build shared
        run: npm run build -w shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration -w server

      - name: Production build
        run: npm run build

  image:
    name: Build and smoke-test the container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t dnd-campaign-manager:ci .

      - name: Start the container
        run: |
          docker run -d --name dnd-ci -p 3001:3001 \
            -e DATABASE_URL="postgresql://unused:unused@127.0.0.1:5432/unused" \
            -e JWT_SECRET="ci-smoke-test" \
            dnd-campaign-manager:ci

      - name: Wait for it to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS localhost:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs dnd-ci
          exit 1

      - name: Refuse an image that runs as root
        run: |
          uid="$(docker exec dnd-ci id -u)"
          if [ "$uid" = "0" ]; then
            echo "the container runs as root"
            exit 1
          fi

      - name: Stop the container
        if: always()
        run: docker rm -f dnd-ci

  deploy:
    name: Build image and deploy
    needs: [verify, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY: dnd-campaign-manager
      ECS_SERVICE: dnd-campaign-manager
      ECS_CLUSTER: default
      APP_URL: https://dn-079c6c706dd84aac8c820c42481f8dc3.ecs.eu-north-1.on.aws
      LOG_GROUP_PATTERN: dnd-campaign-manager
      LOG_RETENTION_DAYS: '7'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecs-role
          role-session-name: github-actions-dnd-deploy

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          version="${GITHUB_SHA::7}"
          uri="$REGISTRY/$ECR_REPOSITORY:$version"
          docker build --platform linux/amd64 --build-arg BUILD_VERSION="$version" -t "$uri" .
          docker push "$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.image.outputs.uri }}
          execution-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/service-role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/service-role/ecsInfrastructureRoleForExpressServices
          container-port: 3001
          health-check-path: /api/health
          cpu: '256'
          memory: '1024'
          min-task-count: 1
          max-task-count: 1
          environment-variables: |
            [
              {"name": "DATABASE_URL", "value": "${{ secrets.DATABASE_URL }}"},
              {"name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET }}"},
              {"name": "DEMO_RESEED_HOURS", "value": "6"},
              {"name": "DATABASE_CA_PATH", "value": "/app/certs/rds-eu-north-1.pem"},
              {"name": "AI_PROVIDER", "value": "gemini"},
              {"name": "AI_RATE_LIMIT_MAX", "value": "6"}
            ]
          secrets: |
            [
              {"name": "GEMINI_API_KEY", "valueFrom": "arn:aws:ssm:${{ env.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:parameter/dnd-campaign-manager/GEMINI_API_KEY"}
            ]

      - name: Verify the live service runs this build
        env:
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
          POLL_TIMEOUT_SECONDS: '900'
          POLL_INTERVAL_SECONDS: '15'
          REQUIRED_CONSECUTIVE_HITS: '5'
        run: |
          deadline=$((SECONDS + POLL_TIMEOUT_SECONDS))
          streak=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            ready=$(curl -fsS --max-time 10 "$APP_URL/api/health/ready" || true)
            live=$(printf '%s' "$ready" | jq -r '.version // empty' 2>/dev/null || true)
            provider=$(printf '%s' "$ready" | jq -r '.ai // empty' 2>/dev/null || true)
            if [ "$live" = "$EXPECTED_VERSION" ]; then
              streak=$((streak + 1))
            else
              streak=0
            fi
            echo "live=${live:-unreachable} expected=$EXPECTED_VERSION ai=${provider:-unknown} streak=$streak/$REQUIRED_CONSECUTIVE_HITS"
            if [ "$streak" -ge "$REQUIRED_CONSECUTIVE_HITS" ]; then
              echo "$APP_URL serves $EXPECTED_VERSION"
              if [ "$provider" != "gemini" ]; then
                echo "::error::the live service resolved the AI provider as '${provider:-unknown}', not gemini"
                exit 1
              fi
              exit 0
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          echo "::error::$APP_URL never settled on $EXPECTED_VERSION"
          exit 1

      - name: Cap CloudWatch log retention
        run: |
          aws logs describe-log-groups \
            --query 'logGroups[].[logGroupName,retentionInDays]' --output text
          matched=$(aws logs describe-log-groups \
            --query "logGroups[?contains(logGroupName, '$LOG_GROUP_PATTERN') && retentionInDays != \`$LOG_RETENTION_DAYS\`].logGroupName" \
            --output text)
          if [ -z "$matched" ]; then
            echo "::notice::no log group matching '$LOG_GROUP_PATTERN' needs a retention change"
            exit 0
          fi
          for group in $matched; do
            aws logs put-retention-policy \
              --log-group-name "$group" \
              --retention-in-days "$LOG_RETENTION_DAYS"
            echo "$group now expires after $LOG_RETENTION_DAYS days"
          done
